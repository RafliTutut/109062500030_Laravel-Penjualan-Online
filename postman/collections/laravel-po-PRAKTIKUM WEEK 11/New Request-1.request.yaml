$kind: http-request
name: New Request
url: "{{base_url}}/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: "{   \r

    \    \"email\": \"titut@customer.com\",   \r

    \    \"password\": \"12345678\",   \r

    \    \"device_name\": \"Postman Praktikum\" \r

    } "
scripts:
